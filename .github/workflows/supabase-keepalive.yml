name: Supabase Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *' # Todo 10 minutos para garantir atividade máxima
  workflow_dispatch:    # Permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Ping via Edge Function
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/keep-alive" \
          -H "Authorization: Bearer ${{ secrets.PING_SECRET }}" \
          -f
