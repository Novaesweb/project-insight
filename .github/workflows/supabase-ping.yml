name: 🏓 Supabase Ping - NovaesWeb Keep Alive

on:
  schedule:
    # A cada 5 minutos (mínimo permitido pelo GitHub)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  ping-supabase:
    name: 🏓 Ping Supabase NovaesWeb
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: 🏓 Ping Supabase Project
      env:
        SUPABASE_URL: https://mvxlbvfryzmocrafhfjp.supabase.co
        SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12eGxidmZyeXptb2NyYWZoZmpwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MzkxODA5MywiZXhwIjoyMDg5NDk0MDkzfQ.Q8pMu0Q9phn5oD62CHMQAxsBzaps6hBuoYlv4h8LJ9Y
      run: |
        echo "🏓 Iniciando ping para manter NovaesWeb Supabase ativo..."
        echo "⏰ Horário: $(date)"
        echo "🔗 URL: $SUPABASE_URL"
        echo "🔑 Key: ${SUPABASE_ANON_KEY:0:20}..."
        
        # Ping 1: Verificar se o projeto está acessível
        echo "📡 Ping 1: Verificando acessibilidade..."
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          "$SUPABASE_URL/rest/v1/" \
          -H "apikey: $SUPABASE_ANON_KEY" \
          -H "Content-Type: application/json")
        
        echo "📊 Status recebido: $HTTP_STATUS"
        
        if [ "$HTTP_STATUS" = "200" ]; then
          echo "✅ Supabase acessível (HTTP $HTTP_STATUS)"
          ACCESSIBLE=true
        else
          echo "❌ Supabase não respondeu (HTTP $HTTP_STATUS)"
          ACCESSIBLE=false
        fi
        
        # Ping 2: Verificar se a API está funcionando
        echo "📡 Ping 2: Testando API básica..."
        API_STATUS=$(curl -s \
          "$SUPABASE_URL/rest/v1/" \
          -H "apikey: $SUPABASE_ANON_KEY" \
          -H "Accept: application/json" \
          -w "%{http_code}" \
          -o /dev/null)
        
        if [ "$API_STATUS" = "200" ]; then
          echo "✅ API Supabase funcionando"
          API_WORKING=true
        else
          echo "⚠️ API não respondeu, mas projeto está ativo"
          API_WORKING=false
        fi
        
        # Ping 3: Testar tabela clientes (saber se está funcionando)
        echo "📡 Ping 3: Testando tabela clientes..."
        TABLES_STATUS=$(curl -s \
          "$SUPABASE_URL/rest/v1/clientes?select=count&limit=1" \
          -H "apikey: $SUPABASE_ANON_KEY" \
          -H "Accept: application/json" \
          -w "%{http_code}" \
          -o /dev/null)
        
        if [ "$TABLES_STATUS" = "200" ]; then
          echo "✅ Tabelas acessíveis"
          TABLES_WORKING=true
        else
          echo "⚠️ Tabelas não acessíveis temporariamente"
          TABLES_WORKING=false
        fi
        
        # Ping 4: Manter conexão ativa (simples)
        echo "📡 Ping 4: Mantendo conexão ativa..."
        KEEP_ALIVE_STATUS=$(curl -s -X GET \
          "$SUPABASE_URL/rest/v1/" \
          -H "apikey: $SUPABASE_ANON_KEY" \
          -H "Accept: application/json" \
          -w "%{http_code}" \
          -o /dev/null)
        
        if [ "$KEEP_ALIVE_STATUS" = "200" ]; then
          echo "✅ Conexão mantida ativa"
          CONNECTION_ACTIVE=true
        else
          echo "⚠️ Keep alive não respondeu"
          CONNECTION_ACTIVE=false
        fi
        
        # Status final
        echo "🎉 Ping concluído em $(date)"
        
        if [ "$ACCESSIBLE" = "true" ] && [ "$API_WORKING" = "true" ]; then
          echo "📊 Status: ✅ Supabase totalmente ativo"
          echo "🚀 NovaesWeb protegido contra congelamento"
          echo "📈 Próximo ping em 6 horas"
          exit 0
        elif [ "$ACCESSIBLE" = "true" ]; then
          echo "📊 Status: ⚠️ Supabase parcialmente ativo"
          echo "🔧 Verificar configurações da API"
          echo "📈 Próximo ping em 6 horas"
          exit 0
        else
          echo "📊 Status: ❌ Supabase não responde"
          echo "🚨 Possível problema de congelamento detectado"
          echo "📞 Verificar status do projeto Supabase"
          exit 1
        fi
        
    - name: 📊 Status Report
      if: always()
      run: |
        echo "## 📊 Relatório de Ping NovaesWeb Supabase"
        echo "⏰ Executado em: $(date)"
        echo "🔄 Frequência: A cada 6 horas"
        echo "🎯 Objetivo: Manter NovaesWeb ativo durante atualizações"
        echo "🌐 Projeto: NovaesWeb"
        echo "✅ Status: Pipeline de keep alive funcionando"
        echo "📈 Próxima execução: $(date -d '+6 hours')"
        
    - name: 📧 Notificar Falha
      if: failure()
      run: |
        echo "❌ Falha no ping do NovaesWeb Supabase"
        echo "🔍 Verificar configurações do projeto"
        echo "🌐 Acessar: https://supabase.com/dashboard"
        echo "📞 Contatar suporte se necessário"
        exit 1
