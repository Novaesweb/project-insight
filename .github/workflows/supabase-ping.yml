name: 🏓 Healthcheck Ping - NovaesWeb

on:
  workflow_dispatch:

jobs:
  ping-healthcheck:
    name: 🏓 Ping interno do site
    if: ${{ secrets.NOVAESWEB_HEALTHCHECK_URL != '' && secrets.NOVAESWEB_HEALTHCHECK_SECRET != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Chamar endpoint interno
        env:
          HEALTHCHECK_URL: ${{ secrets.NOVAESWEB_HEALTHCHECK_URL }}
          HEALTHCHECK_SECRET: ${{ secrets.NOVAESWEB_HEALTHCHECK_SECRET }}
        run: |
          echo "🏓 Executando ping interno da NovaesWeb..."
          curl --fail --silent --show-error \
            --header "x-healthcheck-key: $HEALTHCHECK_SECRET" \
            "$HEALTHCHECK_URL"
