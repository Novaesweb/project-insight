name: 🚀 CI/CD Pipeline - NovaesWeb

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  # 🔍 Quality Checks
  quality:
    name: 🔍 Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: |
        npm ci
        npm install --save-dev @playwright/test

    - name: 🔍 Lint Code
      run: npm run lint
      continue-on-error: false

    - name: 🧪 Type Check
      run: npm run build
      continue-on-error: false

    - name: 📊 Bundle Analysis
      run: |
        npm run analyze:bundle || true
        echo "Bundle size checked"

    - name: 🧪 Run Tests
      run: npm run test
      continue-on-error: false

    - name: 📤 Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # 🧪 E2E Tests
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🎭 Install Playwright
      run: npx playwright install --with-deps

    - name: 🔨 Build Application
      run: npm run build

    - name: 🚀 Start Application
      run: npm run preview &

    - name: ⏳ Wait for Server
      run: npx wait-on http://localhost:4173

    - name: 🎭 Run E2E Tests
      run: npx playwright test

    - name: 📤 Upload E2E Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: playwright-report/

  # 🚀 Deploy Production
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🔨 Build for Production
      run: |
        npm run build
        echo "Build completed successfully"
        ls -la dist/

    - name: 📊 Performance Budget Check
      run: |
        BUNDLE_SIZE=$(du -k dist/assets/index-*.js | cut -f1)
        if [ $BUNDLE_SIZE -gt 1600 ]; then
          echo "❌ Bundle size too large: ${BUNDLE_SIZE}KB (limit: 1600KB)"
          exit 1
        fi
        echo "✅ Bundle size OK: ${BUNDLE_SIZE}KB"

    - name: 🚀 Deploy to Vercel
      uses: vercel/action@v1
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'

    - name: 🔔 Notify Success
      if: success()
      run: |
        echo "🎉 Deploy successful!"
        echo "📊 Performance metrics collected"
        echo "🛡️ All tests passed"
        echo "🚀 Production updated"

    - name: 🚨 Notify Failure
      if: failure()
      run: |
        echo "❌ Deploy failed!"
        echo "🔍 Check logs for details"
        exit 1

  # 🧪 Deploy Staging
  deploy-staging:
    name: 🧪 Deploy to Staging
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🔨 Build for Staging
      run: npm run build

    - name: 🧪 Deploy to Vercel Staging
      uses: vercel/action@v1
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--preview'

  # 🔍 Security Scan
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: � Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: �🔍 Run Security Audit
      run: |
        npm ci
        npm audit --audit-level=moderate
        echo "Security audit completed"

    - name: 🔍 Snyk Security Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  # 📊 Performance Monitoring
  performance:
    name: 📊 Performance Monitoring
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: � Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: �🔍 Lighthouse CI
      run: |
        npm ci
        npm install -g @lhci/cli@0.12.x
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    - name: 📤 Upload Lighthouse Results
      uses: actions/upload-artifact@v3
      with:
        name: lighthouse-results
        path: .lighthouseci/
