name: WebNovaX Keep-Alive API

on:
  schedule:
    - cron: "0 12 * * *" # Diário às 12:00 UTC (09:00 BRT)
  workflow_dispatch:    # Permite disparar na mão para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Batimento Cardíaco (API)
        run: |
          curl --fail -s -X GET "${{ secrets.PING_URL }}" \
          -H "Authorization: Bearer ${{ secrets.PING_SECRET }}"
